name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA; the comment names the release. The Ubuntu
# image is pinned too: ubuntu-latest moves to 26.04 from 2026-10-19
# (actions/runner-images#14748).

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Starlight can show "last updated" dates from git.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A static site; its npm packages run only at build time, on our
      # own pages, so only a critical advisory fails the build.
      - run: npm audit --omit=dev --audit-level=critical

      # astro build also runs the internal-link validator and builds the search index.
      - run: npm run build

      # No deploy here. docs.adto.app is a Render static site that builds from
      # main (render.yaml); docs.dectog.com stays frozen on Cloudflare at the
      # tag docs-dectog-com-final, so nothing in this workflow may reach it.
