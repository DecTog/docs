name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA; the comment names the release. The Ubuntu
# image is pinned too: ubuntu-latest moves to 26.04 from 2026-10-19
# (actions/runner-images#14748).

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Starlight can show "last updated" dates from git.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A static site; its npm packages run only at build time, on our
      # own pages, so only a critical advisory fails the build.
      - run: npm audit --omit=dev --audit-level=critical

      # astro build also runs the internal-link validator and builds the search index.
      - run: npm run build

      # Skipped until the CLOUDFLARE_API_TOKEN repository secret exists; until then
      # deploy from a logged-in machine with `npm run deploy`.
      - name: Deploy to Cloudflare (docs.dectog.com)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
